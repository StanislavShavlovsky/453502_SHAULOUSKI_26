version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=realestate_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret_postgres_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d realestate_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_value:/app/staticfiles
      - media_value:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-your-secret-key-variant-26
      - DATABASE_URL=postgres://postgres:secret_postgres_pass@db:5432/realestate_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_value:
  media_value: