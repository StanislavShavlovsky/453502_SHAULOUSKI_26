{% extends 'agency/base.html' %}
{% block title %}Удаление публикации | EliteEstate{% endblock %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 4rem auto; text-align: center; border-top: 4px solid var(--danger-color); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <h2 style="color: var(--danger-color); margin-bottom: 1rem;">Удалить публикацию?</h2>
    
    <p style="margin-bottom: 2rem; color: #475569; font-size: 1rem; line-height: 1.5;">
        Вы собираетесь безвозвратно удалить новость <strong style="color: #0f172a;">"{{ article.title }}"</strong> из базы данных агентства.
    </p>
    
    <form method="post">
        {% csrf_token %}
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <button type="submit" class="btn btn-danger" style="padding: 0.6rem 2rem; cursor: pointer;">Да, удалить</button>
            <a href="{% url 'news_view' %}" class="btn btn-secondary" style="padding: 0.6rem 2rem; text-decoration: none; display: inline-flex; align-items: center; justify-content: center;">Отмена</a>
        </div>
    </form>
</div>
{% endblock %}
